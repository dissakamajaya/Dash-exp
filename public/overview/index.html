<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXP Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
/* Tokens: Planetfu system as used by Research Ops and Journal (light), Journal dark palette.
   Chart slots: dataviz reference categorical (validated on these surfaces), rust ordinal for
   severity (aging), blue ordinal for progress (funnels, stages). Diverging: blue (+) / orange (-). */
:root {
  --ink: #151515; --ink-2: #3A3A38; --muted: #585752; --faint: #5F5D58;
  --line: #D5D0C2; --line-2: #C3BDAE; --control: #7C786E;
  --fill: #EBE8DF; --fill-2: #E0DCD1; --paper: #FFFFFF; --bg: #F1EFE8;
  --on-ink: #FFFFFF;
  --accent: #BF3D15; --accent-soft: #FDEBE4;
  --ok: #1E7A4C; --ok-soft: #E2F3E9; --warn: #9A5B00; --warn-soft: #FFF2D9; --err: #C2362B; --err-soft: #FBE8E6;
  --mark: #151515; --mark-soft: #C3BDAE; --grid: #EBE8DF;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --o1: #D9967A; --o2: #C87250; --o3: #B5532B; --o4: #8F3A17; --o5: #5E230B;
  --b1: #86AEE3; --b2: #5E92D8; --b3: #2A78D6; --b4: #1D5CA8; --b5: #123F75;
  --sans: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px;
  --fw-regular: 400; --fw-semi: 600; --fw-bold: 700; --ls-head: -.02em;
  --r-lg: 14px; --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #F2F0EA; --ink-2: #D8D5CC; --muted: #A6A29A; --faint: #928E86;
    --line: #3E3C36; --line-2: #4E4A42; --control: #837F76;
    --fill: #2C2B26; --fill-2: #363430; --paper: #191917; --bg: #121211;
    --on-ink: #151515; --accent: #E0602F; --accent-soft: #3A1F14;
    --ok: #56C08A; --ok-soft: #16301F; --warn: #E0A64A; --warn-soft: #33280F; --err: #E47264; --err-soft: #3A1B18;
    --mark: #F2F0EA; --mark-soft: #4E4A42; --grid: #2C2B26;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --o1: #7E3C20; --o2: #A54B25; --o3: #CB5F30; --o4: #E47F52; --o5: #F3A784;
    --b1: #24518A; --b2: #2E6BB5; --b3: #3987E5; --b4: #6AA7EE; --b5: #9DC6F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #F2F0EA; --ink-2: #D8D5CC; --muted: #A6A29A; --faint: #928E86;
  --line: #3E3C36; --line-2: #4E4A42; --control: #837F76;
  --fill: #2C2B26; --fill-2: #363430; --paper: #191917; --bg: #121211;
  --on-ink: #151515; --accent: #E0602F; --accent-soft: #3A1F14;
  --ok: #56C08A; --ok-soft: #16301F; --warn: #E0A64A; --warn-soft: #33280F; --err: #E47264; --err-soft: #3A1B18;
  --mark: #F2F0EA; --mark-soft: #4E4A42; --grid: #2C2B26;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --o1: #7E3C20; --o2: #A54B25; --o3: #CB5F30; --o4: #E47F52; --o5: #F3A784;
  --b1: #24518A; --b2: #2E6BB5; --b3: #3987E5; --b4: #6AA7EE; --b5: #9DC6F5;
  color-scheme: dark;
}

html { scroll-behavior: smooth; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font: var(--fw-regular) var(--fs-md)/1.45 var(--sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
svg { display: block; flex: none; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.pos { color: var(--ok); }
.neg { color: var(--err); }

/* Shell */
.admin { min-height: 100dvh; display: grid; grid-template-columns: 232px minmax(0, 1fr); align-items: start; }
.side { position: sticky; top: 0; height: 100dvh; background: var(--paper); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; gap: 14px; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 6px; font-weight: var(--fw-bold); letter-spacing: var(--ls-head); }
.side-brand i { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; font: var(--fw-bold) var(--fs-xs) var(--sans); font-style: normal; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav a { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 10px; border-radius: 10px; font-size: var(--fs-sm); font-weight: var(--fw-semi); color: var(--ink-2); }
.side nav a:hover { background: var(--fill); }
.side nav a svg { color: var(--muted); }
.side nav a.on { background: var(--ink); color: var(--on-ink); }
.side nav a.on svg { color: inherit; }
.side nav a.down svg { color: var(--err); }
.side nav hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.main { min-width: 0; padding: 28px 32px 96px; max-width: 1240px; width: 100%; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.head h1 { font-size: var(--fs-2xl); font-weight: var(--fw-bold); letter-spacing: var(--ls-head); line-height: 1.15; }
.stamp { font-size: var(--fs-xs); color: var(--muted); }
.btn2 { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; width: 100%; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--paper); font: var(--fw-semi) var(--fs-xs) var(--sans); }
.btn2:hover { background: var(--fill); }

/* Surfaces */
.grid { display: grid; gap: 14px; }
.grid + .grid { margin-top: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.row2 { grid-row: span 2; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.card > h3 { font-size: var(--fs-sm); font-weight: var(--fw-bold); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card > h3 small { font-weight: var(--fw-regular); color: var(--muted); font-size: var(--fs-xs); }
.card.flush { padding: 0; gap: 0; }
.card.flush > h3 { padding: 16px 16px 12px; }
.note { font-size: var(--fs-xs); color: var(--muted); }
.sec { display: flex; margin: 48px 0 14px; font-size: var(--fs-lg); font-weight: var(--fw-bold); letter-spacing: var(--ls-head); scroll-margin-top: 24px; }
.sec a { display: inline-flex; align-items: center; gap: 10px; }
.sec a:hover { text-decoration: underline; text-underline-offset: 4px; }
.sec svg { color: var(--muted); }

/* Stat tiles: proportional figures on big values */
.stat { gap: 6px; }
.stat .lbl { font: var(--fw-semi) var(--fs-xs) var(--sans); color: var(--muted); }
.stat .val { font-size: var(--fs-xl); font-weight: var(--fw-bold); letter-spacing: var(--ls-head); line-height: 1.15; overflow-wrap: anywhere; }
.stat .meta { font-size: var(--fs-xs); color: var(--muted); }
.stat .foot { margin-top: auto; }
.hero { background: var(--ink); border-color: var(--ink); color: var(--on-ink); justify-content: space-between; }
.hero .lbl, .hero .meta { color: inherit; opacity: .72; }
.hero .val { font-size: 64px; line-height: 1; letter-spacing: -.03em; }
.hero .val small { font-size: var(--fs-xl); font-weight: var(--fw-semi); letter-spacing: 0; margin-left: 8px; opacity: .8; }
.hero .meter { background: rgba(127,127,127,.35); }
.hero .meter i { background: var(--on-ink); }
.hero .meter-row { color: inherit; opacity: .72; }
.delta { font-weight: var(--fw-semi); }

/* Meter: same-ramp track */
.meter { height: 8px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--mark); transform-origin: left; }
.meter.warn i { background: var(--warn); }
.meter.err i { background: var(--err); }
.meter-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: var(--fs-xs); color: var(--muted); }
.meter-row b { font-size: var(--fs-xl); color: var(--ink); letter-spacing: var(--ls-head); }
.stackm { display: flex; flex-direction: column; gap: 8px; }

/* Horizontal bars: one hue, value at the tip */
.hb { display: flex; flex-direction: column; gap: 10px; }
.hb .r { display: grid; grid-template-columns: minmax(72px, 34%) minmax(24px, 1fr) auto; gap: 10px; align-items: center; font-size: var(--fs-sm); }
.hb .r > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.hb .t { height: 10px; position: relative; }
.hb .t i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 0 4px 4px 0; background: var(--mark); transform-origin: left; }
.hb .v { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; font-weight: var(--fw-semi); }
.card > .hb { flex: 1; justify-content: space-between; }
.hb .v small { color: var(--muted); font-weight: var(--fw-regular); font-size: var(--fs-xs); margin-left: 6px; }

/* 100% stacked bar (2px surface gap) + legend with visible values */
.stack { display: flex; gap: 2px; height: 14px; }
.stack i { height: 100%; transform-origin: left; min-width: 3px; }
.stack i:first-child { border-radius: 4px 0 0 4px; }
.stack i:last-child { border-radius: 0 4px 4px 0; }
.stack i:only-child { border-radius: 4px; }
.legend { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; font-size: var(--fs-xs); align-items: center; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend .lk { width: 14px; height: 2px; border-radius: 1px; }
.legend > span:nth-child(3n+2) { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend > span:nth-child(3n) { text-align: right; font-weight: var(--fw-semi); font-variant-numeric: tabular-nums; white-space: nowrap; }
.legend small { color: var(--muted); font-weight: var(--fw-regular); }
.keys { display: flex; gap: 14px; font-size: var(--fs-xs); color: var(--muted); }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.keys i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* SVG charts: hairline solid grid, 2px lines */
.chart svg { width: 100%; height: auto; overflow: visible; }
.chart text { font: 11px var(--sans); fill: var(--muted); }
.chart .strong { font-weight: var(--fw-bold); fill: var(--ink); font-size: 12px; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: rgba(127,127,127,.07); }

/* Album grid (Portal) */
.albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.album { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.album .art { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--fill); position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.album .art img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s var(--ease); }
.album:hover .art img { transform: scale(1.04); }
.album .art .ph { position: absolute; inset: 0; display: grid; place-items: center; font: var(--fw-bold) var(--fs-xl) var(--sans); color: var(--muted); }
.album .art .chip { position: absolute; left: 8px; bottom: 8px; }
.album b { font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.album span { font-size: var(--fs-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb { width: 40px; height: 40px; border-radius: 6px; overflow: hidden; background: var(--fill); flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Date badge for schedules */
.db { width: 44px; flex: none; text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 4px 0; line-height: 1.1; }
.db b { display: block; font-size: var(--fs-lg); }
.db span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

/* Card that fills its grid row and scrolls inside */
.fill { position: relative; min-height: 260px; }
.fill > .scroll { position: absolute; inset: 49px 0 0 0; overflow: auto; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.col > .card:last-child { flex: 1; }
.col.span2 { grid-column: span 2; }
.alert { background: var(--err-soft); border-color: transparent; }
.alert .val, .alert .lbl { color: var(--err); }

/* Definition list */
.stat-list { display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; font-size: var(--fs-sm); margin: 0; }
.stat-list dt { color: var(--muted); }
.stat-list dd { margin: 0; text-align: right; font-weight: var(--fw-semi); font-variant-numeric: tabular-nums; }

/* Mini columns */
.mc { display: flex; gap: 10px; align-items: stretch; height: 120px; }
.card > .mc { flex: 1; height: auto; min-height: 120px; }
.mc > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.mc .mt { flex: 1; width: 100%; max-width: 24px; display: flex; align-items: flex-end; }
.mc .mt i { width: 100%; background: var(--mark); border-radius: 4px 4px 0 0; transform-origin: bottom; }
.mc .mv { font-size: var(--fs-xs); font-weight: var(--fw-semi); font-variant-numeric: tabular-nums; }
.mc .ml { font-size: 11px; color: var(--muted); white-space: nowrap; }

/* Waterfall */
.wf { display: flex; flex-direction: column; gap: 8px; }
.wf .r { display: grid; grid-template-columns: minmax(84px, 28%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: var(--fs-sm); }
.wf .r > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.wf .t { position: relative; height: 14px; }
.wf .t i { position: absolute; top: 0; bottom: 0; border-radius: 4px; transform-origin: left; }
.wf .t .zero { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--line-2); }
.card > .wf { flex: 1; justify-content: space-between; }
.wf .r.total { padding-top: 8px; border-top: 1px solid var(--line); font-weight: var(--fw-bold); }
.wf .v { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; font-weight: var(--fw-semi); }

/* Funnel */
.funnel { display: flex; flex-direction: column; gap: 4px; }
.funnel .st { display: flex; justify-content: center; }
.funnel .st i { height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; transform-origin: center; color: #fff; font: var(--fw-bold) var(--fs-sm) var(--sans); min-width: 44px; }
.funnel .cap { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--muted); padding: 0 2px; }
.funnel .cap b { color: var(--ink); }
.funnel .conv { text-align: center; font-size: var(--fs-xs); color: var(--muted); }

/* Heatmap */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 20px); grid-auto-columns: 20px; gap: 5px; }
.heat i { border-radius: 3px; background: var(--fill); }
.heat-legend { display: flex; gap: 3px; align-items: center; font-size: var(--fs-xs); color: var(--muted); justify-content: flex-end; }
.heat-legend i { width: 10px; height: 10px; border-radius: 2px; }

/* Lists & tables */
.li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.li-title { font-weight: var(--fw-semi); font-size: var(--fs-sm); }
.li-sub { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 9px; font-size: var(--fs-xs); font-weight: var(--fw-semi); white-space: nowrap; background: var(--fill); color: var(--ink-2); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.err { background: var(--err-soft); color: var(--err); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tbl-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.table th { text-align: left; font: var(--fw-semi) var(--fs-xs) var(--sans); color: var(--muted); padding: 10px 16px; border-top: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 10px 16px; border-top: 1px solid var(--line); white-space: nowrap; }
.table .r- { text-align: right; font-variant-numeric: tabular-nums; }
.table td.wrap { white-space: normal; min-width: 180px; }
.empty { padding: 20px 0; text-align: center; color: var(--muted); font-size: var(--fs-sm); }

/* Tooltip: value leads, label follows */
#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: var(--fs-xs); box-shadow: 0 8px 24px rgba(0,0,0,.14); opacity: 0; transition: opacity .12s; max-width: 280px; }
#tip.on { opacity: 1; }
#tip b { display: block; font-size: var(--fs-sm); }
#tip span { color: var(--muted); display: block; }

/* Motion: marks grow from zero when their section scrolls into view */
@keyframes gx { from { transform: scaleX(0); } }
@keyframes gy { from { transform: scaleY(0); } }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes arc { from { stroke-dasharray: 0 100; } }
@keyframes fade { from { opacity: 0; } }
.gx { animation: gx .9s var(--ease) both; }
.gy { animation: gy .9s var(--ease) both; transform-box: fill-box; transform-origin: bottom; }
.gy.down { transform-origin: top; }
.draw { stroke-dasharray: 1; animation: draw 1.2s var(--ease) both; }
.arc { animation: arc 1.1s var(--ease) both; }
.fade { animation: fade .8s .25s var(--ease) both; }
.reveal :is(.gx, .gy, .draw, .arc, .fade) { animation-play-state: paused; }
.reveal.in :is(.gx, .gy, .draw, .arc, .fade) { animation-play-state: running; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .gx, .gy, .draw, .arc, .fade { animation: none !important; }
}

@media (max-width: 1080px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* Two columns: a card left alone beside a wide one takes the full row instead of leaving a hole. */
  .g3 > .span2 + :last-child, .g3 > :first-child:has(+ .span2:last-child), .g3 > :nth-child(3):last-child:not(.span2) { grid-column: span 2; }
}
@media (max-width: 760px) {
  .admin { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: 0; z-index: 20; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; gap: 8px; }
  .side-brand, .side-foot, .side nav hr { display: none; }
  .side nav { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; }
  .side nav a { flex: none; min-height: 32px; }
  .main { padding: 20px 16px 64px; }
  .sec { scroll-margin-top: 72px; }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .g3 > .span2, .g2 > .span2, .col.span2 { grid-column: auto; }
  .row2 { grid-row: auto; }
  .hero .val { font-size: 48px; }
  .hb .r, .wf .r { grid-template-columns: minmax(64px, 30%) minmax(12px, 1fr) auto; }
}
</style>
</head>
<body>
<div class="admin">
  <aside class="side">
    <a class="side-brand" href="/" title="Back to Dash"><i>EXP</i>House of EXP</a>
    <nav id="apps" aria-label="Sections"></nav>
    <div class="side-foot"><button class="btn2" id="theme" type="button">Toggle theme</button></div>
  </aside>
  <main class="main" id="main"><div class="empty">Loading…</div></main>
</div>
<div id="tip" role="tooltip"></div>
<script>
/* ───────── Apps, in Pa's order ───────── */
const APPS = [
  ['crm', 'CRM', 'https://crm.houseofexp.com'],

const ICONS = {
  overview: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  journal: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  crm: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  studiostaff: '<rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  research: '<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
  academy: '<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
  nah: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  portal: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>',
  assets: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/>',
  'command-center': '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  admin: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
};
const icon = (id) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[id] ?? ''}</svg>`;

/* ───────── Formatting ───────── */
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const FMT = {
  rp: (n) => {
    if (n == null || !isFinite(n)) return '—';
    const a = Math.abs(n), s = n < 0 ? '−' : '';
    if (a >= 1e9) return `${s}Rp ${(a / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 2 })} M`;
    if (a >= 1e6) return `${s}Rp ${(a / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 })} jt`;
    return `${s}Rp ${Math.round(a).toLocaleString('id-ID')}`;
  },
  int: (n) => n == null || !isFinite(n) ? '—' : Math.round(n).toLocaleString('id-ID'),
  pct: (n) => n == null || !isFinite(n) ? '—' : `${Math.round(n)}%`,
  pct1: (n) => n == null || !isFinite(n) ? '—' : `${n.toLocaleString('id-ID', { maximumFractionDigits: 1 })}%`,
  x: (n) => n == null || !isFinite(n) ? '—' : `${n.toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}×`,
  mo: (n) => n == null || !isFinite(n) ? '—' : n.toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 }),
  mb: (n) => n >= 1e9 ? `${(n / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 1 })} GB` : `${Math.round((n || 0) / 1e6)} MB`,
};
const rp = FMT.rp, int = FMT.int;
const axisRp = (n) => { const a = Math.abs(n), s = n < 0 ? '−' : ''; return a >= 1e9 ? `${s}${+(a / 1e9).toFixed(1)}M` : a >= 1e6 ? `${s}${Math.round(a / 1e6)}jt` : a ? `${s}${Math.round(a / 1e3)}rb` : '0'; };
/* Every number counts up from zero when its section scrolls in. */
const cnt = (v, f = 'int', tag = 'span') => v == null || !isFinite(v) ? '—' : `<${tag} class="cnt" data-v="${v}" data-f="${f}">${FMT[f](0)}</${tag}>`;
const cap = (v) => { const t = String(v ?? '—'); return /^(dj|vo|pr|qris)$/i.test(t) ? t.toUpperCase() : t.replace(/^./, (c) => c.toUpperCase()); };
const month = (p) => new Date(`${p}-01T00:00:00`).toLocaleString('en-GB', { month: 'short' });
const sumOf = (a, k) => (a ?? []).reduce((t, x) => t + (+(typeof k === 'function' ? k(x) : x[k]) || 0), 0);
const avg = (a) => a.length ? a.reduce((t, x) => t + x, 0) / a.length : 0;
const tip = (strong, label = '') => `data-tip="${esc(strong)}" data-tip-sub="${esc(label)}"`;
const toVals = (items, key = 'count') => (items ?? []).map((i) => ({ label: i.label, value: i[key] }));
const pick = (items, label, key = 'count') => (items ?? []).find((i) => i.label === label)?.[key] ?? 0;

/* Color by job */
const SLOTS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];
const AGING = ['var(--o1)', 'var(--o2)', 'var(--o3)', 'var(--o4)', 'var(--o5)'];
const PROGRESS = ['var(--b1)', 'var(--b2)', 'var(--b3)', 'var(--b4)', 'var(--b5)'];
const STATUS = (label) => /^(paid|ok|approved|done|available|matched|accepted|converted|ready|completed|returned|closed|posted)$/i.test(label) ? 'var(--ok)'
  : /^(pending|warn|unmatched|review|quoted|sent|doing|partial|in progress)$/i.test(label) ? 'var(--warn)'
  : /^(void|cancelled|rejected|err|failed|retired|deficit)$/i.test(label) ? 'var(--err)' : 'var(--mark-soft)';
const chip = (v) => { const c = STATUS(v); return `<span class="chip ${c === 'var(--ok)' ? 'ok' : c === 'var(--warn)' ? 'warn' : c === 'var(--err)' ? 'err' : ''}">${esc(v)}</span>`; };

/* ───────── Primitives ───────── */
function stat(label, value, { meta = '', foot = '', cls = '' } = {}) {
  return `<div class="card stat ${cls}"><span class="lbl">${label}</span><span class="val">${value}</span>${meta ? `<span class="meta">${meta}</span>` : ''}${foot ? `<div class="foot">${foot}</div>` : ''}</div>`;
}
const card = (title, body, { cls = '', aside = '' } = {}) => `<div class="card ${cls}"><h3>${title}${aside ? `<small>${aside}</small>` : ''}</h3>${body}</div>`;
function deltaOf(cur, prev, upIsGood = true, suffix = 'vs last month') {
  if (!prev) return '';
  const pct = (cur - prev) / Math.abs(prev) * 100;
  return `<span class="delta ${(pct >= 0) === upIsGood ? 'pos' : 'neg'}">${pct >= 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)}%</span> ${suffix}`;
}
function meter(value, max, { tone = '', label = '', right = '' } = {}) {
  const w = max > 0 ? Math.max(0, Math.min(100, value / max * 100)) : 0;
  return `${label || right ? `<div class="meter-row"><span>${label}</span><span>${right}</span></div>` : ''}<div class="meter ${tone}"><i class="gx" style="width:${w}%"></i></div>`;
}
function hbars(items, { f = 'int', sub } = {}) {
  items = (items ?? []).filter((i) => i && i.value > 0).sort((a, b) => b.value - a.value);
  if (!items.length) return '<div class="empty">—</div>';
  const max = Math.max(...items.map((i) => i.value));
  return `<div class="hb">${items.map((i, k) => `<div class="r" ${tip(FMT[f](i.value), cap(i.label))}><span>${esc(cap(i.label))}</span><div class="t"><i class="gx" style="width:${i.value / max * 100}%;animation-delay:${k * 60}ms"></i></div><span class="v">${cnt(i.value, f)}${sub ? `<small>${sub(i)}</small>` : ''}</span></div>`).join('')}</div>`;
}
function stack(items, colors, { f = 'int' } = {}) {
  items = (items ?? []).filter((i) => i.value > 0);
  if (!items.length) return '<div class="empty">—</div>';
  const total = sumOf(items, 'value');
  const color = (i, k) => typeof colors === 'function' ? colors(i.label) : colors[k % colors.length];
  return `<div class="stack">${items.map((i, k) => `<i class="gx" style="flex:${i.value} 1 0;background:${color(i, k)};animation-delay:${k * 80}ms" ${tip(FMT[f](i.value), `${cap(i.label)} · ${Math.round(i.value / total * 100)}%`)}></i>`).join('')}</div>
    <div class="legend">${items.map((i, k) => `<span class="sw" style="background:${color(i, k)}"></span><span>${esc(cap(i.label))}</span><span>${cnt(i.value, f)} <small>· ${Math.round(i.value / total * 100)}%</small></span>`).join('')}</div>`;
}
function spark(values) {
  if (!values?.length) return '';
  const W = 160, H = 36, min = Math.min(...values, 0), max = Math.max(...values, 1), span = max - min || 1;
  const pts = values.map((v, i) => [i / (values.length - 1) * W, H - 3 - (v - min) / span * (H - 6)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const [lx, ly] = pts.at(-1);
  return `<div class="chart"><svg viewBox="-4 -4 ${W + 8} ${H + 8}" style="height:40px;width:100%" preserveAspectRatio="xMidYMid meet"><path d="${d}" pathLength="1" class="draw" fill="none" stroke="var(--mark-soft)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="fade" cx="${lx}" cy="${ly}" r="4" fill="var(--accent)" stroke="var(--paper)" stroke-width="2"/></svg></div>`;
}
const roundTop = (x, y, w, h, r) => { if (h <= 0) return ''; r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
const roundBottom = (x, y, w, h, r) => { if (h <= 0) return ''; r = Math.min(r, h, w / 2); return `M${x},${y}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w - r}Q${x + w},${y + h} ${x + w},${y + h - r}V${y}Z`; };

/* Area chart (single series): crosshair columns, end label. */
function area(points, { f = 'rp', color = 'var(--s1)', axis = axisRp, every = Math.ceil(points.length / 13) } = {}) {
  const W = 640, H = 210, L = 44, B = 22, T = 18, R = 10;
  const vals = points.map((p) => p.value), max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const y = (v) => T + (H - T - B) * (1 - (v - min) / (max - min || 1));
  const x = (i) => L + (W - L - R) * i / (points.length - 1);
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join('');
  const col = (W - L - R) / (points.length - 1);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">
    ${[min, (min + max) / 2, max].map((t) => `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${axis(t)}</text>`).join('')}
    <path class="fade" d="${line}L${x(points.length - 1)},${y(min)}L${x(0)},${y(min)}Z" fill="${color}" opacity=".1"/>
    <path class="draw" d="${line}" pathLength="1" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="fade" cx="${x(points.length - 1)}" cy="${y(vals.at(-1))}" r="4.5" fill="${color}" stroke="var(--paper)" stroke-width="2"/>
    <text class="strong fade" x="${x(points.length - 1) - 10}" y="${y(vals.at(-1)) - 10}" text-anchor="end">${FMT[f](vals.at(-1))}</text>
    ${points.map((p, i) => `${i % every === 0 ? `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${esc(p.label)}</text>` : ''}<rect class="hit" x="${x(i) - col / 2}" y="${T}" width="${col}" height="${H - T - B}" ${tip(FMT[f](p.value), p.label)}/>`).join('')}
  </svg></div>`;
}
/* Grouped columns; one tooltip lists every series at that X. */
function columns(rows, series, { axis = axisRp, f = 'rp', H = 220 } = {}) {
  const W = 640, L = 44, B = 22, T = 10, R = 6;
  const max = Math.max(...rows.flatMap((r) => series.map((s) => r[s.key])), 1);
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const band = (W - L - R) / rows.length, bw = Math.min(series.length > 1 ? 12 : 24, (band - 10) / series.length);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">
    ${[0, max / 2, max].map((t) => `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${axis(t)}</text>`).join('')}
    ${rows.map((r, i) => {
      const x0 = L + band * i + (band - bw * series.length - 2 * (series.length - 1)) / 2;
      return series.map((s, k) => `<path class="gy" style="animation-delay:${i * 40}ms" d="${roundTop(x0 + k * (bw + 2), y(r[s.key]), bw, y(0) - y(r[s.key]), 4)}" fill="${s.color}"/>`).join('')
        + `<text x="${L + band * i + band / 2}" y="${H - 4}" text-anchor="middle">${esc(r.label)}</text>`
        + `<rect class="hit" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}" ${tip(series.map((s) => `${s.name} ${FMT[f](r[s.key])}`).join(' · '), r.label)}/>`;
    }).join('')}
  </svg></div>`;
}
/* Diverging bars around zero. */
function diverging(rows, { f = 'rp' } = {}) {
  const W = 640, H = 190, L = 44, B = 22, T = 14, R = 6;
  const mx = Math.max(...rows.map((r) => Math.abs(r.value)), 1);
  const mid = T + (H - T - B) / 2, scale = (H - T - B) / 2 / mx;
  const band = (W - L - R) / rows.length, bw = Math.min(24, band - 12);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">
    <line class="gridline" x1="${L}" x2="${W - R}" y1="${T}" y2="${T}"/><line class="gridline" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
    <text x="${L - 8}" y="${T + 4}" text-anchor="end">${axisRp(mx)}</text><text x="${L - 8}" y="${mid + 4}" text-anchor="end">0</text><text x="${L - 8}" y="${H - B + 4}" text-anchor="end">${axisRp(-mx)}</text>
    ${rows.map((r, i) => {
      const x = L + band * i + (band - bw) / 2, h = Math.abs(r.value) * scale;
      const d = r.value >= 0 ? roundTop(x, mid - h, bw, h, 4) : roundBottom(x, mid, bw, h, 4);
      return `<path class="gy ${r.value < 0 ? 'down' : ''}" style="animation-delay:${i * 40}ms" d="${d}" fill="${r.value >= 0 ? 'var(--s1)' : 'var(--s2)'}"/><text x="${L + band * i + band / 2}" y="${H - 4}" text-anchor="middle">${esc(r.label)}</text><rect class="hit" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}" ${tip(FMT[f](r.value), r.label)}/>`;
    }).join('')}
    <line x1="${L}" x2="${W - R}" y1="${mid}" y2="${mid}" stroke="var(--line-2)"/>
  </svg></div>`;
}
/* Donut: ≤5 segments, center carries the headline share. */
function donut(items, { center = '', sub = '', f = 'rp' } = {}) {
  items = items.filter((i) => i.value > 0);
  const total = sumOf(items, 'value'); let acc = 0;
  const segs = items.map((i, k) => {
    const share = i.value / total * 100, len = Math.max(share - (items.length > 1 ? 1 : 0), 0.3);
    const s = `<circle class="arc" style="animation-delay:${k * 90}ms" r="54" cx="70" cy="70" fill="none" stroke="${SLOTS[k]}" stroke-width="18" pathLength="100" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)" ${tip(FMT[f](i.value), `${i.label} · ${Math.round(share)}%`)}/>`;
    acc += share; return s;
  }).join('');
  return `<div style="display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center">
    <div class="chart"><svg viewBox="0 0 140 140">${segs}<text x="70" y="70" text-anchor="middle" class="strong" style="font-size:22px">${center}</text><text x="70" y="88" text-anchor="middle">${esc(sub)}</text></svg></div>
    <div class="legend">${items.map((i, k) => `<span class="sw" style="background:${SLOTS[k]}"></span><span>${esc(i.label)}</span><span>${cnt(i.value, f)}</span>`).join('')}</div>
  </div>`;
}
/* Semicircle gauge for one ratio. */
function gauge(value, max, { label = '', f = 'pct', tone = 'var(--mark)' } = {}) {
  const share = Math.max(0, Math.min(1, value / (max || 1))) * 100;
  return `<div class="chart" style="max-width:220px;margin:0 auto;width:100%"><svg viewBox="0 0 200 120">
    <path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="var(--fill)" stroke-width="16" stroke-linecap="round"/>
    ${share > 0 ? `<path class="arc" d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="${tone}" stroke-width="16" stroke-linecap="round" pathLength="100" stroke-dasharray="${share} 100"/>` : ''}
    <text x="100" y="94" text-anchor="middle" class="strong" style="font-size:28px">${cnt(value, f, 'tspan')}</text>
    <text x="100" y="116" text-anchor="middle">${esc(label)}</text>
  </svg></div>`;
}
/* Mini columns (HTML) for small cards: value on the cap, label below. */
function minicols(items, { f = 'int', values = true } = {}) {
  const max = Math.max(...items.map((i) => i.value), 1);
  return `<div class="mc">${items.map((i, k) => `<div ${tip(FMT[f](i.value), i.label)}>${values ? `<span class="mv">${cnt(i.value, f)}</span>` : ''}<div class="mt"><i class="gy" style="height:${Math.max(i.value / max * 100, 2)}%;animation-delay:${k * 70}ms"></i></div><span class="ml">${esc(i.label)}</span></div>`).join('')}</div>`;
}
const dshort = (v) => v ? new Date(String(v).length <= 10 ? `${v}T12:00:00` : String(v).replace(' ', 'T')).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '—';
function datebadge(v) {
  const d = new Date(String(v).length <= 10 ? `${v}T12:00:00` : String(v).replace(' ', 'T'));
  return `<div class="db"><b>${d.getDate()}</b><span>${d.toLocaleString('en-GB', { month: 'short' })}</span></div>`;
}
function table(title, head, rows, { aside = '', empty = '—', cls = '' } = {}) {
  return `<div class="card flush ${cls}"><h3>${title}${aside ? `<small>${aside}</small>` : ''}</h3>${rows.length ? `<div class="tbl-wrap"><table class="table"><thead><tr>${head.map((h) => `<th class="${h.startsWith('>') ? 'r-' : ''}">${esc(h.replace(/^[>~]/, ''))}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c, i) => `<td class="${head[i].startsWith('>') ? 'r-' : ''} ${head[i].startsWith('~') ? 'wrap' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : `<div class="empty">${empty}</div>`}</div>`;
}
/* 13-week cash forecast from approved fixed costs, payments, goals and open receivables. */
function forecast(plan, cash) {
  const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  const iso = (d) => d.toISOString().slice(0, 10);
  let balance = cash;
  return Array.from({ length: 13 }, (_, w) => {
    const a = new Date(start); a.setDate(start.getDate() + w * 7);
    const b = new Date(a); b.setDate(a.getDate() + 7);
    const inWeek = (s) => s && s >= iso(a) && s < iso(b);
    let out = 0, inflow = 0; const items = [];
    for (const o of plan.overheads) {
      if (o.frequency === 'weekly') { if (iso(b) > `${o.startMonth}-01`) { out += o.amount; items.push(o.title); } continue; }
      for (const m of [a, b]) {
        const ym = iso(m).slice(0, 7), day = `${ym}-${String(o.dayOfMonth ?? 1).padStart(2, '0')}`;
        if (ym >= o.startMonth && inWeek(day) && !items.includes(`${o.title}@${ym}`)) { out += o.amount; items.push(`${o.title}@${ym}`); }
      }
    }
    for (const pmt of plan.payments) if (inWeek(pmt.date)) out += pmt.amount;
    for (const g of plan.goals) if (inWeek(g.due)) out += Math.max(g.target - g.saved, 0);
    for (const r of plan.receivables) if ((w === 0 && r.due < iso(b)) || inWeek(r.due)) inflow += r.amount;
    balance += inflow - out;
    return { label: dshort(iso(a)), inflow, out, net: inflow - out, balance };
  });
}
/* Bullet: actual vs target range. */
function bullet(value, lo, hi) {
  const max = Math.max(hi * 1.1, value, 1), p = (v) => v / max * 100;
  return `<div style="position:relative;height:26px">
      <div style="position:absolute;inset:5px 0;background:var(--fill);border-radius:4px"></div>
      <div style="position:absolute;top:5px;bottom:5px;left:${p(lo)}%;width:${p(hi) - p(lo)}%;background:var(--fill-2)" ${tip(`${rp(lo)} – ${rp(hi)}`, 'Target range')}></div>
      <i class="gx" style="position:absolute;top:9px;bottom:9px;left:0;width:${p(value)}%;background:var(--mark);border-radius:0 4px 4px 0" ${tip(rp(value), 'Actual')}></i>
      <div style="position:absolute;top:0;bottom:0;left:${p(lo)}%;width:2px;background:var(--ink)"></div>

}
/* Funnel: ordinal blue, conversion between steps. */
function funnel(steps) {
  const max = Math.max(...steps.map((s) => s.value), 1);
  return `<div class="funnel">${steps.map((s, i) => `
    ${i ? `<div class="conv">↓ ${FMT.pct(steps[i - 1].value ? s.value / steps[i - 1].value * 100 : 0)}</div>` : ''}
    <div class="st"><i class="gx" style="width:${Math.max(s.value / max * 100, 14)}%;background:${PROGRESS[Math.min(i + 2, 4)]};animation-delay:${i * 100}ms" ${tip(int(s.value), s.label)}>${cnt(s.value)}</i></div>
    <div class="cap" style="justify-content:center"><b>${esc(s.label)}</b></div>`).join('')}</div>`;
}
/* P&L waterfall: revenue, minus expense lines, equals net. */
function waterfall(income, lines, net) {
  const lo = Math.min(0, net), span = income - lo || 1, pos = (v) => (v - lo) / span * 100;
  let running = income;
  const row = (label, a, b, color, value, cls = '', k = 0) => `<div class="r ${cls}" ${tip(rp(value), label)}><span>${esc(label)}</span><div class="t">${lo < 0 ? `<span class="zero" style="left:${pos(0)}%"></span>` : ''}<i class="gx" style="left:${pos(Math.min(a, b))}%;width:${Math.abs(pos(b) - pos(a))}%;background:${color};animation-delay:${k * 70}ms"></i></div><span class="v">${cnt(value, 'rp')}</span></div>`;
  return `<div class="wf">${row('Revenue', 0, income, 'var(--s1)', income)}${lines.map((l, k) => { const a = running; running -= l.value; return row(l.label, running, a, 'var(--s2)', -l.value, '', k + 1); }).join('')}${row('Net', 0, net, net >= 0 ? 'var(--s1)' : 'var(--s2)', net, 'total', lines.length + 1)}</div>`;
}
/* Heatmap: days × weeks, sequential blue. */
function heatmap(byDay, weeks = 13) {
  const end = new Date(); end.setHours(12, 0, 0, 0);
  const start = new Date(end); start.setDate(end.getDate() - end.getDay() - (weeks - 1) * 7);
  const days = []; for (const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) days.push(d.toISOString().slice(0, 10));
  const max = Math.max(...days.map((d) => byDay[d] ?? 0), 1);
  const step = (n) => !n ? 'var(--fill)' : PROGRESS[Math.min(4, Math.floor(n / max * 4.999))];
  return `<div class="heat">${days.map((d, i) => `<i class="fade" style="animation-delay:${i * 5}ms;background:${step(byDay[d] ?? 0)}" ${tip(`${byDay[d] ?? 0} actions`, new Date(`${d}T12:00:00`).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }))}></i>`).join('')}</div>
    <div class="heat-legend">Less${['var(--fill)', ...PROGRESS].map((c) => `<i style="background:${c}"></i>`).join('')}More</div>`;
}

/* ───────── Motion ───────── */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el) {
  const v = +el.dataset.v, f = FMT[el.dataset.f] ?? FMT.int;
  if (reduce) { el.textContent = f(v); return; }
  const t0 = performance.now(), dur = 1100;
  const tick = (t) => { const k = Math.min(1, (t - t0) / dur); el.textContent = f(k < 1 ? v * (1 - Math.pow(1 - k, 3)) : v); if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function animate() {
  const io = new IntersectionObserver((entries) => entries.forEach((e) => {
    if (!e.isIntersecting) return;
    e.target.classList.add('in');
    e.target.querySelectorAll('.cnt').forEach(countUp);
    io.unobserve(e.target);
  }), { threshold: 0.05 });
  document.querySelectorAll('.reveal').forEach((s) => io.observe(s));
}
function trackActive() {
  const links = [...document.querySelectorAll('#apps a')];
  const set = (id) => links.forEach((a) => a.classList.toggle('on', a.dataset.sec === id));
  set('top');
  const io = new IntersectionObserver((entries) => {
    const hit = entries.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (hit) set(hit.target.id);
  }, { rootMargin: '-10% 0px -80% 0px' });
  links.map((a) => document.getElementById(a.dataset.sec)).filter(Boolean).forEach((t) => io.observe(t));
}

/* ───────── Tooltip (textContent only) ───────── */
const tipEl = document.getElementById('tip');
document.addEventListener('pointermove', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (!t) { tipEl.classList.remove('on'); return; }
  tipEl.replaceChildren(Object.assign(document.createElement('b'), { textContent: t.dataset.tip }), Object.assign(document.createElement('span'), { textContent: t.dataset.tipSub ?? '' }));
  tipEl.style.left = `${Math.min(e.clientX + 14, innerWidth - tipEl.offsetWidth - 8)}px`;
  tipEl.style.top = `${Math.min(e.clientY + 14, innerHeight - tipEl.offsetHeight - 8)}px`;
  tipEl.classList.add('on');
});

function showError(message) {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="head"><h1>Overview</h1></div><div class="card"><span class="muted"></span><a class="btn2" style="width:auto;align-self:flex-start" href="/">Back to Dash</a></div>';
  main.querySelector('.muted').textContent = message;
}

const applyTheme = (t) => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
try { applyTheme(localStorage.getItem('exp-founder-theme')); } catch {}
document.getElementById('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('exp-founder-theme', next); } catch {}
});

// Live data from the Dash Worker; Cloudflare Access login is the same as Dash.
fetch('/api/overview', { cache: 'no-store', credentials: 'same-origin' })
  .then(async (r) => r.ok ? r.json() : Promise.reject((await r.json().catch(() => null))?.message ?? `Overview unavailable (${r.status}).`))
  .then((d) => { render(d); animate(); trackActive(); }, (message) => showError(typeof message === 'string' ? message : 'Overview unavailable.'));
</script>
